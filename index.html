<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Коран: Смыслы</title>
<style>
:root{--bg:#10181a;--panel:#172326;--text:#e7eae4;--mute:#8fa39d;--acc:#86c9a9;--line:#263538;--ok:#86c9a9}
:root[data-theme=light]{--bg:#f6f4ed;--panel:#ebe8dd;--text:#1d2723;--mute:#5d6b65;--acc:#1f6a52;--line:#d8d4c6}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 14px calc(30px + env(safe-area-inset-bottom))}
.wrap{max-width:640px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:22px 0 14px}
h1{font:600 28px/1.15 Georgia,"Iowan Old Style","Times New Roman",serif;letter-spacing:.2px}
header p{color:var(--mute);font-size:14px;margin-top:6px;max-width:34ch}
button,summary{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button{background:none;border:1px solid var(--line);border-radius:10px}
#theme{width:44px;height:44px;font-size:20px;flex:none}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--line)}
#q{width:100%;height:46px;padding:0 14px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;font:inherit;outline:none}
#q:focus,textarea:focus,button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chips{display:flex;gap:8px;margin-top:10px;align-items:center}
.chip{height:38px;padding:0 14px;font-size:14px;color:var(--mute)}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:600}
#cnt{margin-left:auto;color:var(--mute);font-size:13px}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 0}
summary::-webkit-details-marker{display:none}
.num{width:34px;flex:none;text-align:right;color:var(--acc);font:600 17px Georgia,serif;font-variant-numeric:tabular-nums}
.nm{flex:1;min-width:0}
.nm b{display:block;font:600 18px/1.25 Georgia,"Iowan Old Style",serif}
.nm small{color:var(--mute);font-size:14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--acc);flex:none}
.star{width:44px;height:44px;border:0;font-size:22px;color:var(--acc);flex:none}
.body{padding:2px 0 18px 46px}
textarea{width:100%;min-height:120px;resize:vertical;padding:12px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;font:inherit;line-height:1.55}
.body a{display:inline-block;margin-top:10px;color:var(--acc);font-size:15px;padding:6px 0}
.empty{padding:30px 0;color:var(--mute);text-align:center}
footer{margin-top:26px;color:var(--mute);font-size:14px}
footer p{margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{height:42px;padding:0 14px;font-size:14px}
#msg{min-height:20px;margin-top:10px;color:var(--ok)}
@media(prefers-reduced-motion:no-preference){.chip,#theme,.star{transition:background-color .15s,color .15s}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>Коран: Смыслы</h1>
    <p>Каталог 114 сур с вашими комментариями. Саму суру читайте по ссылке.</p>
  </div>
  <button id="theme" aria-label="Сменить тему"></button>
</header>

<div class="bar">
  <input id="q" type="search" placeholder="Номер, название или смысл" autocomplete="off" aria-label="Поиск по сурам">
  <div class="chips">
    <button class="chip" data-f="all" aria-pressed="true">Все</button>
    <button class="chip" data-f="notes" aria-pressed="false">С заметками</button>
    <button class="chip" data-f="fav" aria-pressed="false">Избранное</button>
    <span id="cnt"></span>
  </div>
</div>

<main id="list"></main>

<footer>
  <p>Заметки хранятся только в этом браузере. Сохраните копию, чтобы не потерять их при очистке данных.</p>
  <div class="row">
    <button id="exp">Скопировать заметки</button>
    <button id="imp">Вставить заметки</button>
  </div>
  <div id="msg" role="status"></div>
</footer>
</div>

<script>
const RAW=`1|Аль-Фатиха|Открывающая
2|Аль-Бакара|Корова
3|Аль Имран|Семейство Имрана
4|Ан-Ниса|Женщины
5|Аль-Маида|Трапеза
6|Аль-Анам|Скот
7|Аль-Араф|Преграды
8|Аль-Анфаль|Добыча
9|Ат-Тауба|Покаяние
10|Юнус|Юнус
11|Худ|Худ
12|Юсуф|Юсуф
13|Ар-Рад|Гром
14|Ибрахим|Ибрахим
15|Аль-Хиджр|Аль-Хиджр
16|Ан-Нахль|Пчёлы
17|Аль-Исра|Перенос ночью
18|Аль-Кахф|Пещера
19|Марьям|Марьям
20|Та Ха|Та Ха
21|Аль-Анбия|Пророки
22|Аль-Хаджж|Паломничество
23|Аль-Муминун|Верующие
24|Ан-Нур|Свет
25|Аль-Фуркан|Различение
26|Аш-Шуара|Поэты
27|Ан-Намль|Муравьи
28|Аль-Касас|Рассказ
29|Аль-Анкабут|Паук
30|Ар-Рум|Румы
31|Лукман|Лукман
32|Ас-Саджда|Земной поклон
33|Аль-Ахзаб|Союзники
34|Саба|Сава
35|Фатыр|Ангелы
36|Я Син|Я Син
37|Ас-Саффат|Выстроившиеся в ряды
38|Сад|Сад
39|Аз-Зумар|Толпы
40|Гафир|Прощающий
41|Фуссылят|Разъяснены
42|Аш-Шура|Совет
43|Аз-Зухруф|Украшения
44|Ад-Духан|Дым
45|Аль-Джасия|Коленопреклонённая
46|Аль-Ахкаф|Пески
47|Мухаммад|Мухаммад
48|Аль-Фатх|Победа
49|Аль-Худжурат|Комнаты
50|Каф|Каф
51|Аз-Зарият|Рассеивающие
52|Ат-Тур|Гора
53|Ан-Наджм|Звезда
54|Аль-Камар|Луна
55|Ар-Рахман|Милостивый
56|Аль-Вакиа|Событие
57|Аль-Хадид|Железо
58|Аль-Муджадиля|Препирающаяся
59|Аль-Хашр|Сбор
60|Аль-Мумтахана|Испытуемая
61|Ас-Сафф|Ряд
62|Аль-Джумуа|Пятница
63|Аль-Мунафикун|Лицемеры
64|Ат-Тагабун|Взаимное обманывание
65|Ат-Таляк|Развод
66|Ат-Тахрим|Запрещение
67|Аль-Мульк|Власть
68|Аль-Калям|Письменное перо
69|Аль-Хакка|Неизбежное
70|Аль-Мааридж|Ступени
71|Нух|Нух
72|Аль-Джинн|Джинны
73|Аль-Муззаммиль|Закутавшийся
74|Аль-Муддассир|Завернувшийся
75|Аль-Кияма|Воскресение
76|Аль-Инсан|Человек
77|Аль-Мурсалят|Посылаемые
78|Ан-Наба|Весть
79|Ан-Назиат|Исторгающие
80|Абаса|Нахмурился
81|Ат-Таквир|Скручивание
82|Аль-Инфитар|Раскалывание
83|Аль-Мутаффифин|Обвешивающие
84|Аль-Иншикак|Разверзание
85|Аль-Бурудж|Созвездия
86|Ат-Тарик|Ночной странник
87|Аль-Аля|Всевышний
88|Аль-Гашия|Покрывающее
89|Аль-Фаджр|Заря
90|Аль-Балад|Город
91|Аш-Шамс|Солнце
92|Аль-Лайл|Ночь
93|Ад-Духа|Утро
94|Аш-Шарх|Раскрытие груди
95|Ат-Тин|Смоковница
96|Аль-Аляк|Сгусток
97|Аль-Кадр|Предопределение
98|Аль-Байина|Ясное знамение
99|Аз-Залзаля|Землетрясение
100|Аль-Адият|Скачущие
101|Аль-Кариа|Бедствие
102|Ат-Такасур|Страсть к приумножению
103|Аль-Аср|Время
104|Аль-Хумаза|Хулитель
105|Аль-Филь|Слон
106|Курайш|Курайш
107|Аль-Маун|Подаяние
108|Аль-Каусар|Изобилие
109|Аль-Кафирун|Неверующие
110|Ан-Наср|Помощь
111|Аль-Масад|Пальмовые волокна
112|Аль-Ихлас|Очищение
113|Аль-Фаляк|Рассвет
114|Ан-Нас|Люди`;

const S = RAW.split('\n').map(l => { const [n, a, m] = l.split('|'); return { n: +n, a, m }; });
const $ = id => document.getElementById(id);
const L = $('list'), root = document.documentElement;
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const norm = s => s.toLowerCase().replace(/ё/g, 'е');

let st = { notes: {}, fav: [] };
try { const j = localStorage.getItem('ks_v1'); if (j) st = Object.assign(st, JSON.parse(j)); } catch (e) {}
const save = () => { try { localStorage.setItem('ks_v1', JSON.stringify(st)); } catch (e) {} };

function setTheme(t) {
  root.dataset.theme = t;
  $('theme').textContent = t === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem('ks_theme', t); } catch (e) {}
}
let th = null;
try { th = localStorage.getItem('ks_theme'); } catch (e) {}
setTheme(th || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
$('theme').onclick = () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');

let filt = 'all', query = '';
const opened = new Set();

function render() {
  const k = norm(query.trim());
  const list = S.filter(s =>
    (filt === 'all' || (filt === 'notes' && st.notes[s.n]) || (filt === 'fav' && st.fav.includes(s.n))) &&
    (!k || norm(s.n + ' ' + s.a + ' ' + s.m).includes(k)));
  L.innerHTML = list.map(s => `<details data-n="${s.n}"${opened.has(s.n) ? ' open' : ''}>
<summary><span class="num">${s.n}</span><span class="nm"><b>${s.a}</b><small>${s.m}</small></span>${st.notes[s.n] ? '<i class="dot"></i>' : ''}<button class="star" data-s="${s.n}" aria-label="Избранное">${st.fav.includes(s.n) ? '★' : '☆'}</button></summary>
<div class="body"><textarea data-t="${s.n}" placeholder="Ваш комментарий к этой суре">${esc(st.notes[s.n] || '')}</textarea><a href="https://quran.com/${s.n}" target="_blank" rel="noopener">Читать суру на quran.com</a></div></details>`).join('')
    || '<p class="empty">Ничего не найдено. Измените слово поиска или фильтр.</p>';
  $('cnt').textContent = list.length + ' из 114';
}

L.addEventListener('click', e => {
  const b = e.target.closest('.star');
  if (!b) return;
  e.preventDefault();
  const n = +b.dataset.s, i = st.fav.indexOf(n);
  i < 0 ? st.fav.push(n) : st.fav.splice(i, 1);
  save();
  if (filt === 'fav') render(); else b.textContent = i < 0 ? '★' : '☆';
});
L.addEventListener('toggle', e => {
  const n = +e.target.dataset.n;
  e.target.open ? opened.add(n) : opened.delete(n);
}, true);
L.addEventListener('input', e => {
  const t = e.target.closest('textarea');
  if (!t) return;
  const n = t.dataset.t, v = t.value.trim();
  if (v) st.notes[n] = t.value; else delete st.notes[n];
  save();
  const sm = t.closest('details').querySelector('summary');
  let dot = sm.querySelector('.dot');
  if (v && !dot) { dot = document.createElement('i'); dot.className = 'dot'; sm.insertBefore(dot, sm.querySelector('.star')); }
  else if (!v && dot) dot.remove();
});

$('q').addEventListener('input', e => { query = e.target.value; render(); });
document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
  filt = c.dataset.f;
  document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === c));
  render();
});

const msg = t => { $('msg').textContent = t; setTimeout(() => $('msg').textContent = '', 3000); };
$('exp').onclick = async () => {
  const j = JSON.stringify(st);
  try { await navigator.clipboard.writeText(j); msg('Заметки скопированы. Вставьте их в Telegram или в заметки телефона.'); }
  catch (e) { prompt('Скопируйте текст целиком:', j); }
};
$('imp').onclick = () => {
  const j = prompt('Вставьте ранее скопированные заметки:');
  if (!j) return;
  try {
    const o = JSON.parse(j);
    if (!o || typeof o.notes !== 'object') throw 0;
    if (!confirm('Заменить текущие заметки восстановленными?')) return;
    st = { notes: o.notes, fav: Array.isArray(o.fav) ? o.fav : [] };
    save(); render(); msg('Заметки восстановлены.');
  } catch (e) { alert('Это не похоже на скопированные заметки. Проверьте, что вставили текст целиком.'); }
};

render();
</script>
</body>
</html>
